<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Guardians of the Five Flames</title>
<style>
  body {
    background: black;
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
    margin: auto;
    background: #1a0f0a;
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<canvas id="game" width="256" height="224"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let state = "menu"; // menu → worldmap → game

// --- WORLD MAP DATA ---
const worlds = [
  { name: "Agir", x: 96, y: 20, color: "#ff3b3b" },
  { name: "Zagros", x: 40, y: 70, color: "#8fb1ff" },
  { name: "Roj", x: 152, y: 70, color: "#ffd34f" },
  { name: "Çem", x: 96, y: 170, color: "#4fbaff" },
  { name: "Sterk", x: 96, y: 120, color: "#c96bff" }
];

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (state === "menu") {
    state = "worldmap";
  } else if (state === "worldmap") {
    for (let w of worlds) {
      if (mx > w.x && mx < w.x + 64 && my > w.y && my < w.y + 64) {
        alert("Entering World: " + w.name);
        // later: load world levels
      }
    }
  }
});

function drawMenu() {
  ctx.fillStyle = "#1a0f0a";
  ctx.fillRect(0, 0, 256, 224);

  ctx.fillStyle = "#ffcc66";
  ctx.font = "20px monospace";
  ctx.fillText("Guardians of the", 40, 80);
  ctx.fillText("Five Flames", 70, 110);

  ctx.fillStyle = "#ffffff";
  ctx.font = "14px monospace";
  ctx.fillText("Click to Start", 80, 160);
}

function drawWorldMap() {
  ctx.fillStyle = "#0f0a1a";
  ctx.fillRect(0, 0, 256, 224);

  ctx.fillStyle = "#ffffff";
  ctx.font = "16px monospace";
  ctx.fillText("Choose a World", 70, 20);

  worlds.forEach(w => {
    ctx.fillStyle = w.color;
    ctx.fillRect(w.x, w.y, 64, 64);

    ctx.fillStyle = "#000";
    ctx.font = "12px monospace";
    ctx.fillText(w.name, w.x + 8, w.y + 36);
  });
}

function loop() {
  if (state === "menu") drawMenu();
  if (state === "worldmap") drawWorldMap();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
