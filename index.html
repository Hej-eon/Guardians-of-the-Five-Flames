<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guardians of the Five Flames</title>
<style>
  body {
    background: black;
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
    margin: auto;
    image-rendering: pixelated;
    background: black;
  }
</style>
</head>
<body>

<canvas id="game" width="1024" height="768"></canvas>

<script>
// ------------------------------------------------------
// CANVAS SETUP
// ------------------------------------------------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

// ------------------------------------------------------
// GAME STATE
// ------------------------------------------------------
let state = "menu"; // menu → worldmap → game

// ------------------------------------------------------
// LOAD START MENU BACKGROUND IMAGE
// ------------------------------------------------------
const bg = new Image();
bg.src = "images/startmenu.png"; // your uploaded image

bg.onload = () => {
  drawMenu();
};

// ------------------------------------------------------
// CLICK HANDLER
// ------------------------------------------------------
canvas.addEventListener("click", () => {
  if (state === "menu") {
    state = "worldmap";
    drawWorldMap();
  }
});

// ------------------------------------------------------
// DRAW MENU SCREEN
// ------------------------------------------------------
function drawMenu() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw background art
  ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

  // Draw "Click to Start"
  ctx.font = "24px monospace";
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.fillText("Click to Start", canvas.width / 2, 350);
}

// ------------------------------------------------------
// DRAW WORLD MAP SCREEN (placeholder)
// ------------------------------------------------------
function drawWorldMap() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#0f0a1a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#ffffff";
  ctx.font = "28px monospace";
  ctx.textAlign = "center";
  ctx.fillText("World Map Coming Soon", canvas.width / 2, canvas.height / 2);
}

// ------------------------------------------------------
// MAIN LOOP (not needed yet but ready for future use)
// ------------------------------------------------------
function loop() {
  requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
